# Include inside the PUBLIC ASSET GATEWAY server, not the app proxy.
# If ASSET_PUBLIC_BASE contains a path prefix, prepend it to /mag/ here.
# The application retains authenticated backend access and serves authorized
# images via /api/mag/blob/. Do not publish the underlying bucket directly.
location ^~ /mag/ {
    add_header Cache-Control "no-store" always;
    return 404;
}
