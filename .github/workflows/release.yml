name: Build release files

on:
  release: 
    types: [released]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          submodules: recursive
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.10'
      - uses: abatilo/actions-poetry@a5643c67b5fcc9ac5eddb395c7f61b1b66d86034 # v2
        with:
          poetry-version: '1.3.2'
      - run: cd prism-cli && poetry install
      - run: cd prism-cli && poetry run pyinstaller --onefile cli/main.py --add-binary "..\lib\ps2exe\libarchive\win64\libarchive.dll;."
      - uses: actions/upload-artifact@82c141cc518b40d92cc801eee768e7aafc9c2fa2 # v2
        with:
          path: prism-cli/dist/*
