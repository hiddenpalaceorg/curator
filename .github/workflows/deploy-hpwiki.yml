name: Deploy hpwiki

# Ships main to the production box (hpwiki) through a self-hosted runner that
# lives on that box, so nothing has to reach in over SSH.
#
# SECURITY, read before editing: the runner executes as the user that owns the
# hiddenpalace.org MediaWiki install and can read the app's .env.local. This
# repo is PUBLIC, so a fork-controlled trigger here would hand that user's
# shell to anyone who opens a pull request. Only `push` to main and a manual
# dispatch may reach the runner. Never add pull_request, pull_request_target,
# issue_comment, or a workflow_call to this file, and never give another
# workflow a `self-hosted` job.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel a running one: it stops the server
# partway through the swap.
concurrency:
  group: deploy-hpwiki
  cancel-in-progress: false

jobs:
  deploy:
    name: build, swap, verify
    # Forks have no such runner, and a queued job there would hang forever.
    if: github.repository == 'hiddenpalaceorg/prism'
    runs-on: [self-hosted, hpwiki]
    timeout-minutes: 30
    env:
      APP: /home/thedrx/curator-web
      PORT: "6800"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The box's Node is what serves the app, so build with it rather than a
      # runner-managed toolchain: same binary, same native modules.
      - name: put the box's node on PATH
        run: echo "$HOME/node22/bin" >> "$GITHUB_PATH"

      # Workspace root install, so the `cube` workspace package resolves
      # locally instead of hitting the unrelated registry package of that name.
      - name: install workspace deps
        run: npm ci

      - name: typecheck and tests
        working-directory: hp-web
        run: |
          npx tsc --noEmit
          npm test

      # Build once here, while the live server is still up, purely as a gate:
      # a broken build must never be the thing that takes the site down. The
      # build needs DATABASE_URL (build-time page generation reads Postgres),
      # which only exists in the server's own .env.local.
      - name: preflight build
        working-directory: hp-web
        run: |
          ln -sfn "$APP/.env.local" .env.local
          npm run build

      # Everything the server runs, straight from the tree that just passed:
      # source, plus the exact node_modules npm installed here. Syncing the
      # modules is what keeps the app dir from drifting into a hand-curated
      # state. .env.local and asset-store are the server's own and must never
      # be deleted (see the never-wipe rules in the deploy skill). .next-* are
      # the slots' build directories and belong to the box.
      #
      # node_modules lands additively here: both slots are still serving the
      # OLD build and can still lazily require a file that this install would
      # have deleted. The prune pass runs after the swap, once nothing is
      # running the old code.
      - name: sync tree into the app dir
        run: |
          rsync -a --delete \
            --exclude node_modules --exclude '.next*' --exclude .git \
            --exclude tsconfig.tsbuildinfo --exclude .env.local \
            --exclude asset-store \
            hp-web/ "$APP"/
          rsync -a --exclude /cube node_modules/ "$APP"/node_modules/
          rsync -a --exclude node_modules cube/ "$APP"/node_modules/cube/

      # The swap itself: build into .next-stage while both slots keep serving
      # their own build directory, then move them onto it one at a time,
      # checking each is answering (including a real database round trip)
      # before the other is touched. A slot that will not come up goes back on
      # its previous build and the deploy stops there, with the other slot
      # still serving. The site does not go down for any of this.
      #
      # The procedure lives in the app tree (hp-web/deploy/slots.sh), shared
      # with the manual deploy and the watchdog cron, and holds a lock so no
      # two of them can restart the same slot at once.
      - name: build and roll the slots
        run: |
          "$APP/deploy/slots.sh" deploy
          echo "BUILD_ID=$(cat "$APP/.next-stage/BUILD_ID")" >> "$GITHUB_ENV"

      # Now that no process is running the old build, drop whatever this
      # install removed from node_modules.
      - name: prune node_modules
        run: |
          rsync -a --delete --exclude /cube node_modules/ "$APP"/node_modules/
          rsync -a --delete --exclude node_modules cube/ "$APP"/node_modules/cube/

      # The Discord bot runs the same tree, so it needs restarting too, and
      # unlike the app it stays a single process (one gateway session). Only
      # where a DISCORD_TOKEN is configured, and a failure here does not roll
      # the site back: the app is already up and verified.
      - name: restart the discord bot
        continue-on-error: true
        run: |
          "$APP/deploy/slots.sh" restart-bot

      # End to end, through the port hiddenpalace.org actually talks to.
      - name: verify the front door
        run: |
          set -euo pipefail
          for path in /healthz / /builds; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "http://localhost:$PORT$path")
            echo "  GET $path -> $code"
            [ "$code" = 200 ] || exit 1
          done

      - name: summary
        if: always()
        run: |
          {
            echo "### hpwiki deploy"
            echo
            echo "- commit: \`${GITHUB_SHA:0:12}\`"
            echo "- build: \`${BUILD_ID:-none}\`"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Tell the Discord deploy channel how the run ended. The URL lives in
      # the DISCORD_DEPLOY_WEBHOOK repo secret (a webhook URL alone is enough
      # to post, so it stays out of this public file). No secret means skip
      # quietly, and a webhook hiccup must never fail a deploy that already
      # happened, hence continue-on-error.
      - name: notify discord
        if: always()
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          STATUS: ${{ job.status }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "no webhook configured, skipping"; exit 0; }
          SUBJECT=$(git log -1 --format=%s 2>/dev/null) || SUBJECT="(unknown)"
          export SUBJECT
          # Node builds the JSON (arbitrary commit subjects need real
          # escaping) and posts it. The box's node goes on PATH here directly
          # rather than trusting the PATH step ran: a failure notice matters
          # most when the run died early.
          PATH="$HOME/node22/bin:$PATH" node -e '
            const status = process.env.STATUS;
            const kinds = {
              success: { title: "hpwiki deploy succeeded", color: 0x57f287 },
              failure: { title: "hpwiki deploy failed", color: 0xed4245 },
            };
            const kind = kinds[status] || { title: "hpwiki deploy " + status, color: 0x95a5a6 };
            const repo = process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY;
            const sha = process.env.GITHUB_SHA || "";
            const lines = [
              "[`" + sha.slice(0, 12) + "`](" + repo + "/commit/" + sha + ") " + process.env.SUBJECT,
            ];
            if (process.env.BUILD_ID) lines.push("build `" + process.env.BUILD_ID + "`");
            lines.push("[run log](" + repo + "/actions/runs/" + process.env.GITHUB_RUN_ID + ")");
            fetch(process.env.WEBHOOK, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: "prism deploy",
                embeds: [{ title: kind.title, description: lines.join("\n"), color: kind.color }],
              }),
            }).then((res) => {
              if (!res.ok) { console.error("webhook answered " + res.status); process.exitCode = 1; }
            });
          '
